<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Cadastro de Usuário</h2>
    <form id="cadastroForm">
        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
            <span id="nomeMensagem" class="validacaoMensagem"></span>   
        </div>
        <div>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>
            <span id="emailMensagem" class="validacaoMensagem"></span>
        </div>
        <div >
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
            <span id="senhaMensagem" class="validacaoMensagem"></span>
        </div>
        <div >
                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco" required>
                <span id="enderecoMensagem" class="validacaoMensagem"></span>
            </div>
        <div id="telefonesContainer">
            <div class="telefoneContainer">
                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" name="telefone" required>
                <span class="telefoneMensagem validacaoMensagem"></span>
            </div>
        </div>
        <button type="button" id="addTelefone">Adicionar Telefone</button>
        <br><br>
        <button type="submit">Cadastrar</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
