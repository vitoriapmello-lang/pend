<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividades</title>
    <link rel="stylesheet" href="atividades.css">
</head>
<body class="container">

    
    <!-- Mudar cor do título -->
    <h1>Atividades 1</h1>
    <button id="botao">botão azul</button>
    <button id="botao2">botão vermelho</button>
    <p id="texto">Texto para mudar de cor</p>
    <!-- Mostrar e esconder mensagem -->
    <h1>Atividades 2</h1>
    <button id="botao3">botão mostrar e esconder</button>
    <p id="texto2">esse é o texto que pode ser mostrado ou escondido.</p>
    <!-- Contar caracteres -->
    <h1>Atividades 3</h1>
    <input class="casa" type="text" id="inputTexto">
    <p id="contarCaracter">Número de caracteres:</p>
    <!-- Contador de cliques -->
    <h1>Atividades 4</h1>
    <button id="click">Contar Cliques</button>
    <p id="contarCliques">Cliques:</p>
    <!-- Criar elementos dinamicamente -->
    <h1>Atividades 5</h1>
    <input class="casa2" type="text" id="inputDinamico">
    <button id="botao4">Adicionar Item</button>
    <ul id="listaDinamica"></ul>

    <h1>Atividade Hard</h1>
    <input class="casa3" type="text" id="inputNome">
    <button id="botaoEnviar">Enviar</button>
    <p id="mensagem"></p>

    <script src="atividades.js"></script>
</body>
</html>
