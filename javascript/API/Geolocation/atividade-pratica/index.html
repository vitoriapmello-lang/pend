<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diário do Explorador</title>
    <style>
        #camera {
            transform: scaleX(-1);
        }
    </style>
</head>
<body>

    <h1>⛏️ Diário do Explorador</h1>

    <h2>📷 Registrar exploração</h2>

    <video id="camera" autoplay></video>

    <br><br>

    <button id="btnCamera">Ativar câmera</button>
    <button id="btnFoto">Tirar foto</button>

    <br><br>

    <canvas id="foto"></canvas>

    <h2>📍 Localização</h2>

    <button id="btnLocalizacao">Obter localização</button>

    <p id="localizacao">Localização ainda não obtida.</p>

    <h2>📝 Dados da exploração</h2>

    <label for="nomeLocal">Nome do local:</label>
    <input type="text" id="nomeLocal" placeholder="Ex: Minha Base">

    <br><br>

    <label for="bioma">Bioma:</label>
    <select id="bioma">
        <option value="Floresta">🌳 Floresta</option>
        <option value="Montanha">⛰️ Montanha</option>
        <option value="Deserto">🏜️ Deserto</option>
        <option value="Oceano">🌊 Oceano</option>
        <option value="Vila">🏠 Vila</option>
        <option value="Mina">⛏️ Mina</option>
    </select>

    <br><br>

    <button id="btnRegistrar">Registrar exploração</button>

    <h2>📖 Exploração registrada</h2>

    <div id="registro"></div>

    <script src="script.js"></script>

</body>
</html>
