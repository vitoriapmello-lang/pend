<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guia de Filmes e Séries</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecalho">
    <h1>Guia de filmes</h1>
    
    <form id="form-busca" class="form-busca">
      <input type="text" id="input-busca" placeholder="Digite o título" required>
      <button type="submit">Buscar</button>
    </form>
  </header>

  <main class="conteudo-principal">
    <section id="catalogo" class="grid-catalogo">
      <p class="mensagem info">Pesquise por um filme ou série para começar!</p>
    </section>
  </main>

  <script src="dist/main.js"></script>
</body>
</html>
